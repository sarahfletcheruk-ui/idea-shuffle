
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What should Sarah develop today?</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: white;
  color: black;
  font-family: "Times New Roman", Times, serif;
  font-size: 18px;
}

main {
  max-width: 660px;
  margin: 0 auto;
  padding: 12vh 20px 60px;
}

h1 {
  font-size: clamp(32px, 6vw, 46px);
  font-weight: normal;
  line-height: 1.05;
  margin: 0 0 44px;
}

.category {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
  font-size: 16px;
}

select, button, input {
  font: 16px "Times New Roman", Times, serif;
  border: 1px solid black;
  border-radius: 0;
  background: white;
  color: black;
  padding: 9px;
}

select { max-width: 100%; }

#idea {
  min-height: 170px;
  display: flex;
  align-items: center;
  overflow-wrap: anywhere;
  font-size: clamp(28px, 5.5vw, 42px);
  line-height: 1.18;
  margin-bottom: 28px;
}

button {
  padding: 10px 16px;
  cursor: pointer;
}

button:hover {
  background: black;
  color: white;
}

#counter {
  color: #666;
  font-size: 14px;
  margin-top: 18px;
}

details {
  margin-top: 54px;
  border-top: 1px solid #ddd;
  padding-top: 16px;
}

summary { cursor: pointer; }

input {
  width: 100%;
  margin: 18px 0;
}

ol { padding-left: 24px; }

li {
  padding: 7px 0;
  line-height: 1.35;
}

.category-note {
  color: #777;
  font-size: 14px;
}

footer {
  margin-top: 60px;
  color: #777;
  font-size: 13px;
}

@media (max-width: 480px) {
  main { padding-top: 9vh; }
  #idea { min-height: 190px; }
}
</style>
</head>

<body>
<main>
  <h1>What should Sarah develop today?</h1>

  <div class="category">
    <label for="category">Category:</label>
    <select id="category">
      <option value="all">Anything</option>
    </select>
  </div>

  <div id="idea" aria-live="polite"></div>
  <button id="shuffle">Shuffle</button>
  <div id="counter"></div>

  <details>
    <summary>Browse all ideas</summary>
    <input id="search" type="search" placeholder="Find an idea…">
    <ol id="all-ideas"></ol>
  </details>

  <footer>Sarah’s essay idea deck.</footer>
</main>

<script>
const ideas = [
["Why do people prefer AI poetry to poetry written by humans?", "AI & technology"],
["AI in literature competitions and “suspicious reading”", "AI & technology"],
["Was the early AI more uncanny and “creative”?", "AI & technology"],
["Why is Oliver Reed so hot?", "Film & pop culture"],
["AI Psychosis and negative symptoms vs positive symptoms of schizophrenia", "Mind & medicine"],
["Investigation: Did they ever prescribe vibrators and cocaine for hysteria?", "Mind & medicine"],
["Can films have “twists” in the age of social media?", "Film & pop culture"],
["What is scary in a secular age? Religion and horror films.", "Film & pop culture"],
["Why is rape bad? Everyone has a different answer", "Ethics & politics"],
["The Theology of Gisele Pelicot", "Ethics & politics"],
["Charli XCX, Music Fashion Film and “Post Music”", "Music & artists"],
["How a Man Being Sued by the FTC Wants You to Have Childhood Trauma", "Internet & culture"],
["The New Satanic Panic", "Internet & culture"],
["The tech bro films are not scary enough", "Film & pop culture"],
["On Total Eclipse of the Heart", "Music & artists"],
["Autofiction and Kim by Eminem", "Books & poetry"],
["Sylvia Plath and Confession Under Torture", "Books & poetry"],
["On Oliver! the musical and innocence", "Film & pop culture"],
["'True heterosexuality has never been tried'", "Sex & relationships"],
["Has true crime replaced horror as a genre?", "Film & pop culture"],
["Notes on the Ick", "Sex & relationships"],
["Withnail and I, Shakespeare Sonnets, and Platonic Male Love (how women being educated almost killed a genre of romantic poetry)", "Books & poetry"],
["Digital Surveillance and Monogamy", "Sex & relationships"],
["Conservatives don't understand Girls", "Film & pop culture"],
["The Pronatal Comedown in Pop Music", "Music & artists"],
["Generative vs reproductive: tech and approaches to natalism", "AI & technology"],
["'Pick me' has gone the way of 'manic pixie dream girl'", "Internet & culture"],
["The Doors, Hyacinth House, Herbert, Love, and Addiction", "Music & artists"],
["Does Euphoria show that Christianity is seen as just faith-based redemption?", "Film & pop culture"],
["Courtney Love and Hole on the Internet", "Music & artists"],
["Courtney Love and Class: Why is she so resilient?", "Music & artists"],
["Why are Amanda Palmer and Lena Dunham intrinsically cringe?", "Internet & culture"],
["The Swifties ARE Taylor Swift; not even parasocial", "Internet & culture"],
["John Berryman and the Booze Talking: Is it fair?", "Books & poetry"],
["Could Robert Bly be the key to solving the manosphere?", "Ethics & politics"],
["Inside the world of subliminals and living background lives", "Internet & culture"],
["False Hope around Psychedelic Therapy; Nutt and Sessa", "Mind & medicine"],
["I was a youth poet: reflections", "Books & poetry"],
["Reflections on Red Scare, one decade on", "Internet & culture"],
["Why do women artists only think about sex?", "Music & artists"],
["Daddy vs Mommy States and Kink in Politics", "Ethics & politics"],
["90s panic attacks: how have they been watered down? The feminising of panic attacks?", "Mind & medicine"],
["Is all art 'artificially intelligent'? On inspiration and the beyond", "AI & technology"],
["History of deinstitutionalisation and why 'reopen the asylums' means very little", "Mind & medicine"],
["Tumblr and DDLG: how daddy got us in a chokehold", "Internet & culture"],
["Does AA work better in America?", "Mind & medicine"],
["Ranking versions of Mack the Knife", "Music & artists"],
["Ranking versions of I Put a Spell on You", "Music & artists"],
["Why I want the return of the sex comedy", "Film & pop culture"],
["The traumafication of anxiety", "Mind & medicine"],
["Why hasn’t Tori Amos got the reckoning Björk and Kate Bush have?", "Music & artists"],
["What is the role of diagnosis? Private diagnoses etc w ADHD and autism", "Mind & medicine"],
["Chemical Imbalance as justification for certain medications", "Mind & medicine"],
["The mother is the new haunted house", "Books & poetry"],
["The feeling that has no name: boredom, anxiety, and physical illness as the malaise of our time", "Mind & medicine"],
["Ethics of babytrapping", "Ethics & politics"],
["The belle de jour upper class woman and exposes in the Times and Telegraph", "Film & pop culture"],
["The Bell Jar is a YA novel and that's fine", "Books & poetry"]
];

const categorySelect = document.getElementById("category");
const ideaEl = document.getElementById("idea");
const counterEl = document.getElementById("counter");
const searchEl = document.getElementById("search");
const listEl = document.getElementById("all-ideas");

let current = -1;

[...new Set(ideas.map(item => item[1]))]
  .sort()
  .forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    categorySelect.appendChild(option);
  });

function eligibleIdeas() {
  const category = categorySelect.value;

  return ideas
    .map((idea, index) => ({ idea, index }))
    .filter(item =>
      category === "all" || item.idea[1] === category
    );
}

function drawIdea() {
  const options = eligibleIdeas();

  if (!options.length) return;

  let alternatives = options.filter(
    item => item.index !== current
  );

  if (!alternatives.length) {
    alternatives = options;
  }

  const choice =
    alternatives[Math.floor(Math.random() * alternatives.length)];

  current = choice.index;
  ideaEl.textContent = choice.idea[0];

  const category = categorySelect.value;

  if (category === "all") {
    counterEl.textContent =
      `Idea ${current + 1} of ${ideas.length}`;
  } else {
    const position = options.findIndex(
      item => item.index === current
    );

    counterEl.textContent =
      `${category} · Idea ${position + 1} of ${options.length}`;
  }
}

function renderList() {
  const term = searchEl.value.trim().toLowerCase();
  listEl.replaceChildren();

  ideas.forEach(item => {
    if (!item[0].toLowerCase().includes(term)) return;

    const li = document.createElement("li");
    li.appendChild(document.createTextNode(item[0] + " "));

    const note = document.createElement("span");
    note.className = "category-note";
    note.textContent = "— " + item[1];

    li.appendChild(note);
    listEl.appendChild(li);
  });
}

document.getElementById("shuffle")
  .addEventListener("click", drawIdea);

categorySelect.addEventListener("change", drawIdea);
searchEl.addEventListener("input", renderList);

renderList();
drawIdea();
</script>
</body>
</html>
